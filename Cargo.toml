[package]
name = "vigil-protection-rpc"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
solana-sdk = "2"
solana-client = "2"
solana-transaction-status = "2"
base64 = "0.22"
bincode = "1"
bs58 = "0.5"
reqwest = { version = "0.12", features = ["json"] }
sandwich-detector = { git = "https://github.com/SangHyeonKwon/solana-sandwich-detector" }
lru = "0.12"
dotenvy = "0.15"

[dev-dependencies]
solana-system-transaction = "2"
